<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="shorten-flow-title shorten-flow-desc">
      <title id="shorten-flow-title">How a short link is created</title>
      <desc id="shorten-flow-desc">Flowchart of the POST /shorten flow: the API validates the URL, draws a random seven-character code, claims it in Cassandra with a conditional insert, draws again on a collision up to five times, caches the winner in Redis, and answers 201, 400, or 503.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <!-- Start -> D1 -->
      <line x1="332" y1="88" x2="332" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D1 "NO" right -> 400 -->
      <line x1="444" y1="164" x2="568" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D1 "YES" down -> draw -->
      <line x1="332" y1="216" x2="332" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Draw -> D2 -->
      <line x1="332" y1="296" x2="332" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D2 "NO" right -> D3 -->
      <line x1="456" y1="376" x2="532" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D3 "NO" back-edge up and left into the draw step -->
      <path d="M 644 324 L 644 284 Q 644 276 636 276 L 420 276" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D3 "YES" down -> 503 -->
      <line x1="644" y1="428" x2="644" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- D2 "YES" down -> cache (coral, happy path) -->
      <line x1="332" y1="432" x2="332" y2="456" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- Cache -> 201 -->
      <line x1="332" y1="512" x2="332" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="492" y="144" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="504" y="153" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="340" y="220" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="356" y="229" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="480" y="356" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="492" y="365" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

      <rect x="492" y="256" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="528" y="265" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">DRAW AGAIN</text>

      <rect x="652" y="432" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="668" y="441" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <rect x="340" y="436" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="356" y="445" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

      <!-- Start oval -->
      <rect x="244" y="40" width="176" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="332" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">POST /shorten</text>
      <text x="332" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">{ "url": "https://..." }</text>

      <!-- Diamond 1: URL valid? -->
      <polygon points="332,112 444,164 332,216 220,164" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="332" y="162" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Is the URL absolute</text>
      <text x="332" y="176" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">http or https?</text>

      <!-- End oval: 400 -->
      <rect x="568" y="140" width="184" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="660" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">400 Bad Request</text>
      <text x="660" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ErrorResponse</text>

      <!-- Step: draw a code -->
      <rect x="244" y="240" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="332" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Draw a random code</text>
      <text x="332" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">7 chars - base62</text>

      <!-- Diamond 2: insert won? -->
      <polygon points="332,320 456,376 332,432 208,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="332" y="366" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Did this request</text>
      <text x="332" y="380" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">win the code?</text>
      <text x="332" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CASSANDRA - IF NOT EXISTS</text>

      <!-- Diamond 3: fifth failed draw? -->
      <polygon points="644,324 756,376 644,428 532,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="644" y="374" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fifth failed</text>
      <text x="644" y="388" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">draw?</text>

      <!-- End oval: 503 -->
      <rect x="552" y="452" width="184" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="644" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">503 Service Unavailable</text>
      <text x="644" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ErrorResponse</text>

      <!-- Step: cache -->
      <rect x="244" y="456" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="332" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cache a copy in Redis</text>
      <text x="332" y="498" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">expires after 24 h</text>

      <!-- End oval: 201 (coral focal) -->
      <rect x="240" y="536" width="184" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="332" y="560" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">201 Created</text>
      <text x="332" y="576" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Location + short link</text>

      <!-- Legend -->
      <line x1="40" y1="620" x2="920" y2="620" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="636" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND - SHAPE CARRIES TYPE</text>

      <rect x="40" y="648" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="656" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Start / end (oval)</text>

      <rect x="220" y="648" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="252" y="656" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Step (rectangle)</text>

      <polygon points="412,654 424,648 436,654 424,660" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="448" y="656" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Decision (diamond)</text>

      <line x1="604" y1="652" x2="632" y2="652" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="640" y="656" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Happy path</text>

      <line x1="768" y1="652" x2="796" y2="652" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="804" y="656" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Branch</text>
    </svg>

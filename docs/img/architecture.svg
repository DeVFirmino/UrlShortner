<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700"><!-- svg-source:excalidraw -->
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="context-stroke"/></marker><style>text{font-family:"Segoe Print","Comic Sans MS",cursive;fill:#1e1e1e}.shape{stroke-width:2.5;stroke-linejoin:round}.arrow{fill:none;stroke:#1e1e1e;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}</style></defs>
  <rect width="1100" height="700" fill="#ffffff"/>
  <text x="550" y="48" text-anchor="middle" font-size="28">How a short link is created and opened</text>
  <rect class="shape" x="30" y="140" width="190" height="100" rx="18" fill="#a5d8ff" stroke="#2563eb"/><text x="125" y="170" text-anchor="middle" font-size="18">Person or app</text><text x="125" y="194" text-anchor="middle" font-size="18">creates a short link</text><text x="125" y="218" text-anchor="middle" font-size="18">or opens a short code</text>
  <rect class="shape" x="270" y="150" width="170" height="80" rx="18" fill="#d0bfff" stroke="#7c3aed"/><text x="355" y="183" text-anchor="middle" font-size="18">nginx</text><text x="355" y="207" text-anchor="middle" font-size="18">shares the requests</text>
  <rect x="490" y="80" width="360" height="480" rx="22" fill="#dbe4ff" fill-opacity=".35" stroke="#4a9eed" stroke-opacity=".45" stroke-width="2"/><text x="670" y="115" text-anchor="middle" font-size="18" fill="#1d4ed8">Three ASP.NET Core app copies</text>
  <rect class="shape" x="520" y="145" width="90" height="45" rx="12" fill="#a5d8ff" stroke="#2563eb"/><text x="565" y="174" text-anchor="middle" font-size="16">copy 1</text>
  <rect class="shape" x="625" y="145" width="90" height="45" rx="12" fill="#a5d8ff" stroke="#2563eb"/><text x="670" y="174" text-anchor="middle" font-size="16">copy 2</text>
  <rect class="shape" x="730" y="145" width="90" height="45" rx="12" fill="#a5d8ff" stroke="#2563eb"/><text x="775" y="174" text-anchor="middle" font-size="16">copy 3</text>
  <rect class="shape" x="530" y="235" width="280" height="70" rx="16" fill="#fff3bf" stroke="#b45309"/><text x="670" y="264" text-anchor="middle" font-size="18">1 · Create a short code</text><text x="670" y="288" text-anchor="middle" font-size="18">or find the original address</text>
  <rect class="shape" x="530" y="345" width="280" height="70" rx="16" fill="#eebefa" stroke="#7c3aed"/><text x="670" y="374" text-anchor="middle" font-size="18">2 · Check Redis first</text><text x="670" y="398" text-anchor="middle" font-size="18">continue below if not found</text>
  <rect class="shape" x="530" y="455" width="280" height="70" rx="16" fill="#c3fae8" stroke="#0d9488"/><text x="670" y="484" text-anchor="middle" font-size="18">3 · Read or save the link</text><text x="670" y="508" text-anchor="middle" font-size="18">in Cassandra</text>
  <rect class="shape" x="900" y="300" width="180" height="90" rx="18" fill="#ffc9c9" stroke="#ef4444"/><text x="990" y="326" text-anchor="middle" font-size="18">Redis — fast cache</text><text x="990" y="350" text-anchor="middle" font-size="18">keeps popular links</text><text x="990" y="374" text-anchor="middle" font-size="18">for 24 hours</text>
  <rect class="shape" x="900" y="445" width="180" height="100" rx="18" fill="#c3fae8" stroke="#0d9488"/><text x="990" y="475" text-anchor="middle" font-size="18">Cassandra</text><text x="990" y="499" text-anchor="middle" font-size="18">keeps every short link</text><text x="990" y="523" text-anchor="middle" font-size="18">and original address</text>
  <rect class="shape" x="250" y="600" width="600" height="70" rx="16" fill="#fff3bf" stroke="#b45309" stroke-width="1.5"/><text x="550" y="630" text-anchor="middle" font-size="18">If Cassandra finds a link, Redis remembers it for next time.</text><text x="550" y="654" text-anchor="middle" font-size="18">Temporary redirects keep future visit counting possible.</text>
  <path class="arrow" d="M220 190 L270 190"/><path class="arrow" d="M440 190 L520 168"/><path class="arrow" d="M670 190 L670 235"/><path class="arrow" d="M670 305 L670 345"/><path class="arrow" d="M810 380 L900 345" stroke="#ef4444"/><path class="arrow" d="M670 415 L670 455"/><path class="arrow" d="M810 490 L900 495" stroke="#0d9488"/><path class="arrow" d="M990 445 L990 390" stroke="#ef4444" stroke-dasharray="8 8"/>
</svg>

events {}

http {
    upstream urlshortner_backend {
        server app1:8080;
        server app2:8080;
        server app3:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://urlshortner_backend;
            # Without this nginx hands the app "Host: urlshortner_backend", and
            # the short links the app builds from the Host header only work
            # inside the compose network. $http_host keeps the host AND the
            # port the caller actually used, e.g. localhost:8080.
            proxy_set_header Host $http_host;
        }
    }
}
